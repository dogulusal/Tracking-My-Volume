<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Tracking My Volume</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrite, so refreshing on a deep link
      // (e.g. /Tracking-My-Volume/history) serves this 404 page instead of the
      // app. Encode the requested path into the query string and bounce to
      // index.html, where the snippet in <head> restores it via replaceState.
      // Repo is served from /<repo>/, so keep 1 leading path segment.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
