    <script type="text/javascript">
      // Counterpart to public/404.html: turn the ?/history bounce back into a
      // real path before React Router reads location. Must run before the app.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
